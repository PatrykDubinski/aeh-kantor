version: '3.9'

services:
  db:
    image: postgres:16
    container_name: currency_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: currency_exchange
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: ./backend
    container_name: currency_api
    command: bash -c "rails s -b 0.0.0.0"
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/currency_exchange

  frontend:
    build: ./frontend
    container_name: currency_mobile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - web
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0

volumes:
  pgdata:
